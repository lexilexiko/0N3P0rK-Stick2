; 0N3P0rK - Tamagotchi pig + barn on M5StickC Plus 2
; Ported from M5Cardputer / Cardputer ADV
; Author: lexilexiko

[platformio]
default_envs = m5stickcplus2

[env:m5stickcplus2]
platform = espressif32@6.12.0
; StickC Plus2. Not m5stick-c: that package is the old StickC
; (4MB flash, AXP192, ARDUINO_M5Stick_C).
board = m5stickc-plus2
framework = arduino
custom_version = 1.4.0b
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; M5GFX boards.hpp: board_M5StickCPlus2 = 5. Pins: DC 14, RST 12,
    ; BL 27, HOLD 4. No AXP192.
    -DM5GFX_BOARD=5
    -DBOARD_NAME=\"M5StickCPlus2\"
    -DCONFIG_MDNS_HOSTNAME=\"onelpig\"
    -Wl,--allow-multiple-definition
    -include src/build_info.h
    -include src/compat.h
    -Os
    -Wl,-Map,.pio/build/m5stickcplus2/output.map
lib_deps =
    m5stack/M5Unified@^0.2.11
    bblanchon/ArduinoJson@^7.4.2

extra_scripts = pre:scripts/pre_build.py