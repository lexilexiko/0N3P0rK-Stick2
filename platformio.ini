; 0N3P0rK - Tamagotchi pig + barn on M5StickC Plus 2
; Ported from M5Cardputer / Cardputer ADV
; Author: lexilexiko

[platformio]
default_envs = m5stickcplus2

[env:m5stickcplus2]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
custom_version = 1.4.0b
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_M5Stack_StickCPlus2
    -DBOARD_NAME=\"M5StickCPlus2\"
    -DCONFIG_MDNS_HOSTNAME=\"onelpig\"
    -Wl,--allow-multiple-definition
    -include src/build_info.h
    -include src/compat.h
    -Os
    -DFASTLED_RMT_BUILTIN_DRIVER=1
    -DFASTLED_ESP32_RMT_CHANNEL_0=0

lib_deps =
    m5stack/M5Unified@^0.2.11
    bblanchon/ArduinoJson@^7.4.2
    t-vk/ESP32 BLE Keyboard@0.3.2
    fastled/FastLED@^3.7.0
    ; Helix MP3 decoder (libhelix) - kept for lib compat, disabled on StickC Plus 2 (no SD)
    https://github.com/pschatzmann/codec-helix.git
extra_scripts = pre:scripts/pre_build.py
