; 0N3P0rK - Tamagotchi pig + barn on M5StickC Plus 2
; Ported from M5Cardputer / Cardputer ADV
; Author: lexilexiko

[platformio]
default_envs = m5stickcplus2

[env:m5stickcplus2]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
custom_version = 1.4.0b
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_M5Stick_C_Plus2
    -DBOARD_NAME=\"M5StickCPlus2\"
    -DCONFIG_MDNS_HOSTNAME=\"onelpig\"
    -Wl,--allow-multiple-definition
    -include src/build_info.h
    -include src/compat.h
    -Os
    -Wl,-Map,.pio/build/m5stickcplus2/output.map
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    bblanchon/ArduinoJson@^7.4.2

extra_scripts = pre:scripts/pre_build.py